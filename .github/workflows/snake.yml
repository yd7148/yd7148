name: Generate contribution snake

on:
  schedule:
    # 每 6 小時更新一次 contribution snake 動畫
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main (to keep history)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=38bdf8&color_dots=0e7490,0891b2,06b6d4,22d3ee,67e8f9

      - name: Commit snake animations to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "update contribution snake animations"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}